name: Release

# Push a tag such as v1.1.0 to build signed Android packages and publish them
# as a GitHub release. The app's update check reads that release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  android:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Every release must be signed with the same key, or phones cannot
      # install the update over the old version.
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPRINTUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the SPRINTUR_KEYSTORE_* secrets before releasing (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SPRINTUR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SPRINTUR_KEYSTORE_PASSWORD: ${{ secrets.SPRINTUR_KEYSTORE_PASSWORD }}
          SPRINTUR_KEY_ALIAS: ${{ secrets.SPRINTUR_KEY_ALIAS }}
          SPRINTUR_KEY_PASSWORD: ${{ secrets.SPRINTUR_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS="--build-name=$VERSION --build-number=${{ github.run_number }}"
          flutter pub get
          flutter build apk --release $ARGS
          flutter build appbundle --release $ARGS
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/sprintur-$VERSION.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/sprintur-$VERSION.aab"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sprintur ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
